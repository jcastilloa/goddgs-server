service:
  host: 0.0.0.0
  port: 8080
  api_prefix: /v1
  request_timeout: 30s
  max_proxy_retries: 1

auth:
  token: ""

llm:
  base_url: ""
  api_key: ""
  headers: {}

extract_ai:
  model: gpt-4.1-mini
  timeout: 45s
  temperature: 0.1
  retries: 2

# Optional rendered-HTML extraction through Chrome/Chromium. Disabled preserves
# the existing HTTP extraction path and launches no browser process.
chrome:
  enabled: false
  # Empty discovers Chrome/Chromium at startup and persists it in the active config.yaml.
  executable_path: ""
  # Per-page navigation and rendered-DOM capture budget.
  timeout: 45s
  # Global Chrome process limit across all proxies.
  max_browsers: 2
  # Concurrent isolated browser contexts allowed in one process.
  max_pages_per_browser: 3
  # Close a process after it has been unused for this duration.
  idle_timeout: 1m

research:
  timeout: 10m
  # Maximum normalized search-result metadata candidates sent to selection_ai.
  max_selection_candidates: 100
  # Maximum selection_ai-approved URLs that can be downloaded and extracted.
  max_selected_sources: 20
  max_concurrent_extractions: 20
  query_ai:
    model: gpt-4.1-mini
    timeout: 30s
    temperature: 0.1
    retries: 2
  selection_ai:
    model: gpt-4.1-mini
    timeout: 30s
    temperature: 0.1
    retries: 2
  report_ai:
    model: gpt-4.1-mini
    timeout: 60s
    temperature: 0.1
    retries: 2

operations:
  # Optional absolute or relative SQLite database path. By default it is
  # operations.sqlite beside the executable.
  database_path: ""
  # How long completed operational records are kept.
  retention: 720h
  dashboard_auth:
    # Session lifetime for the local operations dashboard account.
    session_ttl: 12h
    # Set true when users access the dashboard through HTTPS.
    cookie_secure: false
  # Disabled by default: active probes generate outbound traffic.
  probe:
    enabled: false
    # Required when enabled. It must be a stable HTTP(S) endpoint controlled by the operator.
    url: ""
    interval: 1m
    timeout: 10s
    success_threshold: 2
    failure_threshold: 3

proxies:
  - name: direct
    type: direct
