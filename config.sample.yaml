service:
  host: 0.0.0.0
  port: 8080
  api_prefix: /v1
  version: 0.1.0
  request_timeout: 30s
  max_proxy_retries: 1

auth:
  token: ""

llm:
  base_url: ""
  api_key: ""
  headers: {}

extract_ai:
  model: gpt-4.1-mini
  timeout: 45s
  temperature: 0.1
  retries: 2

research:
  timeout: 10m
  query_ai:
    model: gpt-4.1-mini
    timeout: 30s
    temperature: 0.1
    retries: 2
  report_ai:
    model: gpt-4.1-mini
    timeout: 60s
    temperature: 0.1
    retries: 2

proxies:
  - name: direct
    type: direct
