<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{TITLE}} · Operations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; --canvas:#070b18; --surface:rgba(15,23,42,.88); --line:rgba(148,163,184,.2); --ink:#edf4ff; --muted:#91a4c6; --primary:#67a8ff; --danger:#fb7185; }
    * { box-sizing:border-box; } body { min-width:320px; min-height:100vh; margin:0; display:grid; place-items:center; color:var(--ink); background:radial-gradient(circle at 9% 5%,rgba(72,111,255,.25),transparent 34rem),radial-gradient(circle at 95% 100%,rgba(123,73,255,.16),transparent 29rem),var(--canvas); }
    main { width:min(100% - 32px,470px); padding:28px; border:1px solid var(--line); border-radius:22px; background:linear-gradient(145deg,rgba(20,31,54,.94),var(--surface)); box-shadow:0 25px 65px rgba(0,0,0,.32); }
    .mark { display:grid; width:48px; height:48px; place-items:center; border:1px solid rgba(103,168,255,.36); border-radius:15px; color:#cce0ff; background:linear-gradient(145deg,rgba(103,168,255,.22),rgba(123,73,255,.2)); } .eyebrow { margin:23px 0 7px; color:var(--primary); font-size:.72rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:0 0 9px; font-size:clamp(1.75rem,6vw,2.25rem); letter-spacing:-.045em; } p { margin:0; color:var(--muted); line-height:1.55; } form { display:grid; gap:16px; margin-top:27px; } label { display:grid; gap:7px; color:#d9e6fa; font-size:.83rem; font-weight:750; } input { width:100%; min-height:45px; padding:0 13px; border:1px solid var(--line); border-radius:12px; color:var(--ink); background:rgba(5,11,25,.68); font:inherit; } input:focus-visible, button:focus-visible { outline:3px solid rgba(103,168,255,.55); outline-offset:2px; } button { min-height:45px; border:0; border-radius:12px; color:#071221; background:#d9e8ff; font:inherit; font-weight:800; cursor:pointer; } button:disabled { opacity:.6; cursor:wait; } .error { min-height:1.3em; color:#ffc3ce; font-size:.84rem; } .hint { font-size:.76rem; } .hint b { color:#dceafe; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h3l2.1-6 3.8 12L14 12h7"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="21" cy="12" r="1" fill="currentColor"/></svg></div>
    <p class="eyebrow">Operations dashboard</p><h1>{{TITLE}}</h1><p>{{DESCRIPTION}}</p>
    <form id="authentication" novalidate><label>Username<input id="username" name="username" autocomplete="username" minlength="3" maxlength="64" pattern="[A-Za-z0-9._-]+" required></label><label>Password<input id="password" name="password" type="password" autocomplete="{{PASSWORD_AUTOCOMPLETE}}" minlength="12" maxlength="128" required></label><p class="hint"><b>Password:</b> 12–128 characters. Your credentials remain on this server.</p><p id="error" class="error" role="alert" aria-live="polite"></p><button id="submit" type="submit">{{ACTION}}</button></form>
  </main>
  <script>
    const mode = '{{MODE}}';
    document.querySelector('#authentication').addEventListener('submit', async event => {
      event.preventDefault(); const error = document.querySelector('#error'); const button = document.querySelector('#submit'); error.textContent = ''; button.disabled = true;
      const body = { username: document.querySelector('#username').value, password: document.querySelector('#password').value };
      try { const response = await fetch(`/operations/api/auth/${mode}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }); const result = await response.json().catch(() => ({})); if (!response.ok) throw new Error(result.error || 'Unable to continue'); window.location.assign('/operations'); } catch (failure) { error.textContent = failure.message; } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
